<template>
    <lightning-card title="Grandparent Component">
        <div class="slds-m-around_medium">
            <lightning-input 
                label="Grandparent Value"
                value={grandparentValue}
                onchange={handleGrandparentChange}
                required data-requiredfield>
            </lightning-input>
            
            <c-parent-component 
                grandparent-value={grandparentValue} onparentvalidation={handleParentEvent}>
            </c-parent-component>
        </div>
          <lightning-button 
                label="Submit" 
                variant="brand" 
                onclick={handleSubmit}>
            </lightning-button>
    </lightning-card>
</template>
